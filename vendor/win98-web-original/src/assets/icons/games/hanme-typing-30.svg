<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer frame (DOS/Win98 game box style) -->
  <rect x="2" y="2" width="28" height="28" fill="#000000"/>
  <rect x="1" y="1" width="28" height="28" fill="#c0c0c0"/>
  <!-- Sky & Sea background (Venezia motif) -->
  <rect x="3" y="3" width="24" height="17" fill="#0000a8"/>
  <rect x="3" y="20" width="24" height="7" fill="#008080"/>
  <!-- Falling words blocks in sky -->
  <rect x="5" y="5" width="6" height="3" fill="#ffffff"/>
  <rect x="6" y="6" width="4" height="1" fill="#000080"/>
  <rect x="19" y="7" width="6" height="3" fill="#ffff00"/>
  <rect x="20" y="8" width="4" height="1" fill="#800000"/>
  <!-- Venezia Tower in center -->
  <rect x="13" y="8" width="4" height="3" fill="#ff0080"/>
  <rect x="12" y="11" width="6" height="9" fill="#dfdfdf"/>
  <rect x="13" y="12" width="4" height="3" fill="#800080"/>
  <rect x="11" y="19" width="8" height="2" fill="#808080"/>
  <!-- Waves -->
  <rect x="5" y="22" width="4" height="1" fill="#00ffff"/>
  <rect x="13" y="24" width="6" height="1" fill="#00ffff"/>
  <rect x="21" y="22" width="4" height="1" fill="#00ffff"/>
</svg>
