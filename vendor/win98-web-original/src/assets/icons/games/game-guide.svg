<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Classic Windows 98 Help Book Icon -->
  <rect x="5" y="3" width="22" height="26" fill="#000000"/>
  <rect x="4" y="2" width="22" height="26" fill="#800080"/>
  <rect x="6" y="4" width="18" height="22" fill="#9932cc"/>
  <rect x="4" y="2" width="3" height="26" fill="#4b0082"/>
  <!-- Pages edge -->
  <rect x="25" y="4" width="2" height="23" fill="#ffffff"/>
  <!-- Yellow Question Mark -->
  <rect x="12" y="8" width="6" height="2" fill="#ffff00"/>
  <rect x="16" y="10" width="2" height="3" fill="#ffff00"/>
  <rect x="14" y="13" width="2" height="3" fill="#ffff00"/>
  <rect x="14" y="18" width="2" height="2" fill="#ffff00"/>
</svg>
